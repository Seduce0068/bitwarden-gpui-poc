[package]
name = "bitwarden-gpui-poc"
version = "0.1.101"
edition = "2021"
rust-version = "1.95"
description = "Bitwarden/Vaultwarden client PoC built with GPUI (gpui-kit)"
license = "AGPL-3.0-or-later"

[lib]
name = "bitwarden_gpui_poc"
path = "src/lib.rs"

[[bin]]
name = "bitwarden-gpui-poc"
path = "src/main.rs"

[dependencies]
# Pinned: the UI code targets gpui-kit 0.9.1's API; a minor bump may break it.
gpui-kit = "=0.9.1"
# 0.1.1 exposes raw sync bodies so our PascalCase normalizer can be used.
openwarden = "=0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
getrandom = "0.3"
sha2 = "0.11"
url = "2"
smol = "2"
# Unique temp files with create_new + 0600 + RAII cleanup (already transitive).
tempfile = "3"
# Full Unicode NFKD normalization for search and duplicate detection.
unicode-normalization = "0.1"
# Secret input buffers are wiped on drop/replacement (already in the lockfile
# as a transitive dependency of secrecy/openwarden).
zeroize = "1.9"

[dev-dependencies]
# The opt-in real-server E2E test needs a Tokio runtime because openwarden's
# HTTP client is reqwest-based; tokio is already in the lockfile via gpui.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.dev]
# GPUI + wgpu の debuginfo は巨大（debug=1 でも target/ が 30GiB）。
# バックトレースは残しつつ行テーブルのみに抑制する。
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Defense in depth: unsafe is already forbidden at the crate root.
undocumented_unsafe_blocks = "deny"
