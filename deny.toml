# cargo-deny 0.21 設定（schema v2）。
# 使い方: cargo deny check （advisories / bans / licenses / sources を一括検査）

[advisories]
# 脆弱性（vulnerability）は常にゲートを失敗させる。ignore は空。
# 推移依存の unmaintained は、ピン留めした gpui-kit 0.9.1 由来で
# こちらでは解消できないため失敗させない（共通ワークフローの
# cargo audit と同じ方針）。直接依存が unmaintained になった場合は失敗。
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# 許可するのはパーミッシブ／弱コピーレフトのみ。
# 強コピーレフト（GPL / AGPL / LGPL 系）は意図的に含めない。
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    # このクレート自身は AGPL-3.0-or-later。依存クレートには AGPL を認めない。
    { crate = "bitwarden-gpui-poc", allow = ["AGPL-3.0-or-later"] },
    # MPL-2.0 はファイル単位の弱コピーレフト。実際にグラフに現れる
    # 3 クレートに限定して許可する（グローバルな allow には入れない）。
    { crate = "cbindgen", allow = ["MPL-2.0"] },
    { crate = "dwrote", allow = ["MPL-2.0"] },
    { crate = "option-ext", allow = ["MPL-2.0"] },
]

[licenses.private]
# ワークスペース内のクレートも検査対象にする（上の exception で自身を許可）。
ignore = false

[bans]
# 同一クレートの複数バージョンは警告（勝手に失敗させず可視化する）。
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
allow-workspace = true

[sources]
# クレート取得元は crates.io のみに固定する。
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
