name: CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
  # 固定版の依存に対する新規脆弱性情報を定期的に検出する。
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    uses: Seduce0068/workflows/.github/workflows/rust-gates.yml@v1
    with:
      # Cargo.toml の rust-version を CI でも検証する。
      rust_toolchain: "1.95"
      audit: true
      extra_gates: |
        RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked
        # cargo-deny は共通ワークフローにまだ組み込まれていないため、ここで導入する。
        CARGO_DENY_VERSION=0.21.0
        cargo install cargo-deny --version ${CARGO_DENY_VERSION} --exact --locked
        cargo deny check
        # ドキュメント書式ゲート（共通ワークフローにまだ無いためここで導入）。
        grep -Fq "cargo install --version ${CARGO_DENY_VERSION}" README.md
        MARKDOWNLINT_VERSION=0.50.0
        npm install --global markdownlint-cli@${MARKDOWNLINT_VERSION}
        grep -Fq "markdownlint-cli@${MARKDOWNLINT_VERSION}" README.md
        markdownlint README.md CHANGELOG.md todo.md 'docs/**/*.md'
        # シークレットスキャンは pre-commit を主軸とし、CI を最終ゲートとする。
        GITLEAKS_VERSION=8.28.0
        # pre-commit と CI の版がずれないようにする（片方だけの更新を検出）。
        grep -q "rev: v${GITLEAKS_VERSION}" .pre-commit-config.yaml
        GITLEAKS_ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl -sSfL \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}" \
          -o "/tmp/${GITLEAKS_ARCHIVE}"
        curl -sSfL \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
          -o /tmp/gitleaks-checksums.txt
        # --ignore-missing だけだと対象行が欠けても0件で成功するため、
        # アーカイブの行を明示的に確認してからその1行だけを検証する。
        (cd /tmp && grep -Fq "${GITLEAKS_ARCHIVE}" gitleaks-checksums.txt)
        (cd /tmp && grep -F "${GITLEAKS_ARCHIVE}" gitleaks-checksums.txt | sha256sum -c -)
        tar -xzf "/tmp/${GITLEAKS_ARCHIVE}" -C /tmp gitleaks
        /tmp/gitleaks dir --redact --config .gitleaks.toml
        # pre-commit を回避して投入された秘密を履歴からも検出する。
        # 浅いクローンのまま走ると過去の秘密を見逃すため、必要なときだけ
        # 全履歴を取得し、失敗した場合はゲートを失敗させる。
        if git rev-parse --is-shallow-repository | grep -q '^true$'; then
          git fetch --unshallow
        fi
        /tmp/gitleaks git --redact --config .gitleaks.toml
      # Clippy lints (unwrap/expect/panic/unsafe) are denied via Cargo.toml [lints.clippy].
