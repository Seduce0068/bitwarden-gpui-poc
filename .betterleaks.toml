title = "betterleaks config for bitwarden-gpui-poc"

# Generated build output is skipped before regex matching.
prefilter = '''
filter.matchesAny(attributes["path"], [`(^|/)target/`])
'''

# Known synthetic fixtures used only in tests and documentation.
# Scoped to these literals so real secrets in the same commits are still detected.
filter = '''
filter.matchesAny(finding["secret"], [
  `2\.aWxvdGhlcg==`,
  `テストアカウントのマスターパスワード`,
  `!password123`, `password123!`, `1!password`,
])
|| filter.containsAny(finding["match"], [`2001:db8::1`, `https://user:pass@host`,  `https://u:p@host:8443`, `passwordあいうえお`,
  `secret=GEZDGNBVGY3TQOJQ`,
  `https://user:p?ss@host`, `https://user:pass?x=1@host`,
  `https://user:pa#ss=w@host/path`, `https://host:8443?email=a@b`,
  `https://user:SECRET@host?email=a@b`,
  `[::1]?email=a@b`, `[::1]:8443?email=a@b`,
  `https://user:p;a=s@host`, `https://user:p;a&b=s@host`, `https://u:p;a=s@host`, `HTTPS://user:p@host`,
  `https://user:pass@169.254.169.254`, `https://user:pass@[fe80::1]`,
  `https://user:pass@[::ffff:169.254.1.1]`, `https://user:pass@metadata.google.internal`,
  `https://user:pass@169.254.169.254.nip.io`, `https://user:12345?@host`,
  `https://vault.example.com:8443#frag@x`,
  `https://user:SECRET@[::1]`, `https://user:IPv6SECRET@[::1]:8443`,
  `authenticate(&invalid, "device")`])
|| (
  filter.matchesAny(attributes["path"], [`vault_sync_tests\.rs`]) &&
  filter.matchesAny(finding["line"], [`"Password"\s*:`])
)
'''

[extend]
useDefault = true
