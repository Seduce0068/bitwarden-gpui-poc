title = "betterleaks config for bitwarden-gpui-poc"

# Generated build output is skipped before regex matching.
prefilter = '''
filter.matchesAny(attributes["path"], [`(^|/)target/`, `(^|/)node_modules/`])
'''

# Known synthetic fixtures used only in tests and documentation.
# Every secret literal is anchored (^...$) so a real secret that merely contains
# a fixture substring is still detected. Keep all known canaries listed here.
# The vault_sync_tests.rs line exception is additionally gated on anchored
# fixture secret literals; a line pattern alone would suppress unknown secrets.
filter = '''
filter.matchesAny(finding["secret"], [
  `^2\.aWxvdGhlcg==$`,
  `^テストアカウントのマスターパスワード$`,
  `^!password123$`, `^password123!$`, `^1!password$`, `^12345678!$`,
  `^r2-core-151-device$`, `^r2-core-152-prelogin$`, `^r2-core-152-token$`,
  `^r2-core-153-parse$`, `^r2-core-153-live$`,
])
|| filter.containsAny(finding["match"], [`2001:db8::1`, `https://user:pass@host`,  `https://u:p@host:8443`, `passwordあいうえお`,
  `secret=GEZDGNBVGY3TQOJQ`,
  `https://user:p?ss@host`, `https://user:pass?x=1@host`,
  `https://user:pa#ss=w@host/path`, `https://host:8443?email=a@b`,
  `https://user:SECRET@host?email=a@b`,
  `[::1]?email=a@b`, `[::1]:8443?email=a@b`,
  `https://user:p;a=s@host`, `https://user:p;a&b=s@host`, `https://u:p;a=s@host`, `HTTPS://user:p@host`,
  `https://user:pass@169.254.169.254`, `https://user:pass@[fe80::1]`,
  `https://user:pass@[::ffff:169.254.1.1]`, `https://user:pass@metadata.google.internal`,
  `https://user:pass@169.254.169.254.nip.io`, `https://user:12345?@host`,
  `https://user:12345?text@host`, `https://user:0000#frag@host:8443/p`,
  `https://user:12345?=@host`, `https://alice:12345?text@host`,
  `https://bob:0000?text@host/path`, `https://host:8443#frag@x`,
  `https://alice:12345?=@host`, `https://alice:12345?==@host/path`,
  `https://user:p?x@host?@evil`, `https://user:p@ss?@host`,
  `https://user:p?@host`,
  `https://user:12345?key=value@host`, `https://bob:01234?state=ok@host/path`,
  `https://vault.example.com:8443#frag@x`,
  `https://user:SECRET@[::1]`, `https://user:IPv6SECRET@[::1]:8443`,
  `authenticate(&invalid, "device")`])
|| (
  filter.matchesAny(attributes["path"], [`vault_sync_tests\.rs`]) &&
  filter.matchesAny(finding["line"], [`"Password"\s*:`]) &&
  filter.matchesAny(finding["secret"], [
    `^"?vT7#kQm2!zR9wP4\$xL8@"?$`,
    `^REAL_PASSWORD$`, `^UNDECRYPTABLE_PASSWORD$`, `^2\.pass$`, `^2\.user$`,
    `^NEW_PASSWORD_VALUE$`, `^NEW_UPDATED_PASSWORD$`,
    `^KEPT_PASSWORD_VALUE$`, `^FIRST_PASSWORD_VALUE$`,
    `^SECOND_PASSWORD_VALUE$`, `^NEVER_IN_THE_MODEL$`,
  ])
)
'''

[extend]
useDefault = true
