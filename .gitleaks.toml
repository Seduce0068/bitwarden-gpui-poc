title = "gitleaks config for bitwarden-gpui-poc"

[extend]
useDefault = true

[allowlist]
description = "Generated build output and a known synthetic test fixture value"
paths = ['''^target/''']
# A fixed base32-style placeholder used only in offline-cache tests.
# Scoped to this literal instead of whole commits so real secrets in the same
# commits are still detected.
regexes = ['''2\.aWxvdGhlcg==''']
